<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vx-kinetic-slide-line</title>
<style>
  /* Bundled OFL fonts (assets/fonts), shared by every Motion Studio template.
     Six selectable families; each bundled file gets one face declaration. */
  @font-face {
    font-family: "VX Antonio";
    src: url("../../fonts/Antonio-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Antonio";
    src: url("../../fonts/Antonio-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Inter";
    src: url("../../fonts/Inter-Variable.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Bebas Neue";
    src: url("../../fonts/BebasNeue.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Montserrat";
    src: url("../../fonts/Montserrat.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Playfair Display";
    src: url("../../fonts/PlayfairDisplay.ttf") format("truetype");
    font-weight: 400 900;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX JetBrains Mono";
    src: url("../../fonts/JetBrainsMono.ttf") format("truetype");
    font-weight: 100 800;
    font-style: normal;
    font-display: block;
  }
  :root {
    --vx-font-antonio: "VX Antonio", "VX Inter", sans-serif;
    --vx-font-inter: "VX Inter", "VX Antonio", sans-serif;
    --vx-font-bebasneue: "VX Bebas Neue", "VX Antonio", sans-serif;
    --vx-font-montserrat: "VX Montserrat", "VX Inter", sans-serif;
    --vx-font-playfairdisplay: "VX Playfair Display", "VX Inter", serif;
    --vx-font-jetbrainsmono: "VX JetBrains Mono", "VX Inter", monospace;
    --vx-font-family: var(--vx-font-antonio);
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    -webkit-font-smoothing: antialiased;
    font-family: var(--vx-font-family);
  }
  #stage { position: absolute; inset: 0; background: transparent; }
  #stack {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .row {
    display: flex;
    align-items: center;
    width: 100%;
    box-sizing: border-box;
  }
  .row.reverse { flex-direction: row-reverse; }
  .dash {
    flex: 0 0 auto;
    border-radius: 999px;
    transform-origin: 0 50%;
  }
  .row.reverse .dash { transform-origin: 100% 50%; }
  .txt {
    flex: 0 0 auto;
    color: #ffffff;
    font-weight: 800;
    line-height: 1.04;
    letter-spacing: -0.028em;
    white-space: nowrap;
    text-shadow: 0 6px 30px rgba(0, 0, 0, 0.48);
  }
</style>
</head>
<body>
<div id="stage">
  <div id="stack">
    <div class="row" id="row0"><div class="dash" id="dash0"></div><div class="txt" id="txt0"></div></div>
    <div class="row reverse" id="row1"><div class="dash" id="dash1"></div><div class="txt" id="txt1"></div></div>
    <div class="row" id="row2"><div class="dash" id="dash2"></div><div class="txt" id="txt2"></div></div>
  </div>
</div>
<script>
/* Pure function of t and the params. No clock, no timers, no CSS animation. */
(function () {
  "use strict";

  var VX_FONT_IDS = [
    "antonio", "inter", "bebasneue",
    "montserrat", "playfairdisplay", "jetbrainsmono"
  ];

  var DURATION = 2.2;

  var DEFAULTS = {
    font: "antonio",
    line1: "Apro la scena",
    line2: "Il ritmo sale",
    line3: "Chiudo il cerchio",
    accent: "#7CFF6B"
  };

  var stage = document.getElementById("stage");
  var rows = [];
  var dashes = [];
  var texts = [];
  var i;
  for (i = 0; i < 3; i++) {
    rows.push(document.getElementById("row" + i));
    dashes.push(document.getElementById("dash" + i));
    texts.push(document.getElementById("txt" + i));
  }

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function span(t, a, b) { return clamp01((t - a) / (b - a)); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeOutQuint(x) { return 1 - Math.pow(1 - x, 5); }

  function whenFontsReady() {
    if (!document.fonts) { return Promise.resolve(); }
    return Promise.all([
      document.fonts.load('400 40px "VX Antonio"'),
      document.fonts.load('700 40px "VX Antonio"'),
      document.fonts.load('400 40px "VX Inter"'),
      document.fonts.load('400 40px "VX Bebas Neue"'),
      document.fonts.load('400 40px "VX Montserrat"'),
      document.fonts.load('400 40px "VX Playfair Display"'),
      document.fonts.load('400 40px "VX JetBrains Mono"')
    ]).catch(function () {}).then(function () {
      return document.fonts.ready;
    });
  }

  function apply(t) {
    var p = Object.assign({}, DEFAULTS, window.__vxParams || {});
    var vxFontId = VX_FONT_IDS.indexOf(p.font) >= 0 ? p.font : DEFAULTS.font;
    document.documentElement.style.setProperty("--vx-font-family",
      "var(--vx-font-" + vxFontId + ")");
    var w = window.innerWidth;
    var h = window.innerHeight;

    var pad = Math.round(w * 0.085);
    var fontSize = Math.round(h * 0.047);
    var dashW = Math.round(w * 0.062);
    var dashH = Math.max(4, Math.round(h * 0.0032));
    var dashGap = Math.round(w * 0.030);
    var rowGap = Math.round(h * 0.026);
    var slide = Math.round(w * 0.12);
    var out = easeOutCubic(span(t, DURATION - 0.38, DURATION - 0.03));

    var labels = [p.line1, p.line2, p.line3];
    var index;
    var fromRight;
    var start;
    var dash;
    var line;
    var offset;

    for (index = 0; index < 3; index++) {
      fromRight = index % 2 === 1;
      rows[index].style.paddingLeft = pad + "px";
      rows[index].style.paddingRight = pad + "px";
      rows[index].style.marginTop = index === 0 ? "0px" : rowGap + "px";
      rows[index].style.justifyContent = "flex-start";

      dashes[index].style.width = dashW + "px";
      dashes[index].style.height = dashH + "px";
      dashes[index].style.background = p.accent;
      dashes[index].style.marginLeft = fromRight ? dashGap + "px" : "0px";
      dashes[index].style.marginRight = fromRight ? "0px" : dashGap + "px";

      texts[index].style.fontSize = fontSize + "px";
      texts[index].textContent = labels[index];

      start = 0.14 + index * 0.30;
      dash = easeOutQuint(span(t, start, start + 0.24));
      line = easeOutCubic(span(t, start + 0.10, start + 0.54));
      offset = Math.round((1 - line) * slide * (fromRight ? 1 : -1));

      dashes[index].style.opacity = String(clamp01(dash * 3) * (1 - out));
      dashes[index].style.transform = "scaleX(" + dash.toFixed(5) + ")";
      texts[index].style.opacity = String(line * (1 - out));
      texts[index].style.transform = "translate3d(" + offset + "px,0,0)";
    }
  }

  window.__vxSeek = function (t) {
    apply(t);
    void stage.offsetHeight;
    return new Promise(function (resolve) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { void stage.offsetHeight; whenFontsReady().then(resolve); });
      });
    });
  };

  apply(0);
})();
</script>
</body>
</html>
