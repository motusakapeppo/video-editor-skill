<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vx-sticker-doodle</title>
<style>
  /* Bundled OFL fonts (assets/fonts), shared by every Motion Studio template. */
  @font-face {
    font-family: "VX Antonio";
    src: url("../../fonts/Antonio-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Antonio";
    src: url("../../fonts/Antonio-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Inter";
    src: url("../../fonts/Inter-Variable.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  :root {
    --vx-font-display: "VX Antonio", "VX Inter", sans-serif;
    --vx-font-text: "VX Inter", "VX Antonio", sans-serif;
    --vx-font-family: var(--vx-font-display);
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    -webkit-font-smoothing: antialiased;
    font-family: var(--vx-font-family);
  }
  #stage {
    position: absolute;
    inset: 0;
    background: transparent;
    overflow: hidden;
  }
  #word {
    position: absolute;
    color: #FFFFFF;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    line-height: 1;
    white-space: nowrap;
    text-shadow: 0 4px 26px rgba(0, 0, 0, 0.50);
    transform-origin: 50% 50%;
  }
  #ink {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #caption {
    position: absolute;
    color: rgba(255, 255, 255, 0.82);
    font-weight: 600;
    letter-spacing: 0.30em;
    text-transform: uppercase;
    text-align: center;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.55);
  }
</style>
</head>
<body>
<div id="stage">
  <svg id="ink" viewBox="0 0 1080 1920">
    <path id="scribble1" d="" fill="none" stroke-linecap="round"></path>
    <path id="scribble0" d="" fill="none" stroke-linecap="round"></path>
  </svg>
  <div id="word"></div>
  <div id="caption"></div>
</div>
<script>
/* vx-sticker-doodle: a hand-drawn ellipse sketched around the word with
   stroke-dashoffset. Two overlapping passes plus a tail give the ink wobble. */
(function () {
  "use strict";

  var DUR = 2.2;
  var DEFAULTS = {
    font: "antonio",
    label: "IDEA",
    caption: "sketch it",
    accent: "#FF5C8A",
    stroke: 16,
    wobble: 0.34
  };

  var stage = document.getElementById("stage");
  var svg = document.getElementById("ink");
  var word = document.getElementById("word");
  var caption = document.getElementById("caption");
  var paths = [
    document.getElementById("scribble0"),
    document.getElementById("scribble1")
  ];

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function span(t, a, b) { return clamp01((t - a) / (b - a)); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeOutQuint(x) { return 1 - Math.pow(1 - x, 5); }

  function loopPath(cx, cy, rx, ry, tilt, wobble, turn, phase) {
    var d = "";
    var steps = 96;
    var cosT = Math.cos(tilt);
    var sinT = Math.sin(tilt);
    for (var i = 0; i <= steps; i++) {
      var u = i / steps;
      var a = u * Math.PI * 2 * turn + phase;
      var sx = rx * (1 + wobble * 0.38 * Math.sin(4 * a + 0.9)) * Math.cos(a);
      var sy = ry * (1 + wobble * 0.38 * Math.sin(2 * a + 2.2)) * Math.sin(a);
      var x = cx + sx * cosT - sy * sinT;
      var y = cy + sx * sinT + sy * cosT;
      d += (i === 0 ? "M " : " L ") + x.toFixed(2) + " " + y.toFixed(2);
    }
    return d;
  }

  function whenFontsReady() {
    if (!document.fonts) { return Promise.resolve(); }
    return Promise.all([
      document.fonts.load('400 40px "VX Antonio"'),
      document.fonts.load('700 40px "VX Antonio"'),
      document.fonts.load('400 40px "VX Inter"')
    ]).catch(function () {}).then(function () {
      return document.fonts.ready;
    });
  }

  function apply(t) {
    var p = Object.assign({}, DEFAULTS, window.__vxParams || {});
    document.documentElement.style.setProperty("--vx-font-family",
      p.font === "inter" ? "var(--vx-font-text)" : "var(--vx-font-display)");
    var w = window.innerWidth;
    var h = window.innerHeight;
    var len = Math.max(1, String(p.label).length);
    var size = Math.min(h * 0.165, (w * 0.56) / (len * 0.62));
    var cx = w * 0.5;
    var cy = h * 0.49;
    var textW = len * size * 0.62;
    var rx = Math.min(textW * 0.64 + size * 0.10, w * 0.36);
    var ry = rx * 0.62;
    var tilt = -0.055;
    var wobble = Number(p.wobble);
    var draw = easeOutQuint(span(t, 0.10 * DUR, 0.50 * DUR));
    var cap = easeOutCubic(span(t, 0.46 * DUR, 0.62 * DUR));

    word.textContent = p.label;
    word.style.fontSize = Math.round(size) + "px";
    word.style.left = "0px";
    word.style.width = w + "px";
    word.style.textAlign = "center";
    word.style.top = Math.round(cy - size * 0.53) + "px";
    word.style.opacity = String(easeOutCubic(span(t, 0.02 * DUR, 0.26 * DUR)));
    word.style.transform = "rotate(" + (tilt * 57.2958 * 0.35).toFixed(3) + "deg)";

    svg.setAttribute("viewBox", "0 0 " + w + " " + h);

    var passes = [
      { rx: rx, ry: ry, tilt: tilt, phase: 0.35, width: Number(p.stroke), alpha: 1.0, delay: 0.0 },
      { rx: rx * 1.035, ry: ry * 1.07, tilt: tilt + 0.03, phase: 1.15, width: Number(p.stroke) * 0.62, alpha: 0.55, delay: 0.06 }
    ];

    for (var i = 0; i < 2; i++) {
      var L = passes[i];
      var el = paths[i];
      var pr = clamp01((draw - L.delay) / (1 - L.delay));
      el.setAttribute("d", loopPath(cx, cy, L.rx, L.ry, L.tilt, wobble, 1.0, L.phase));
      el.setAttribute("pathLength", "100");
      el.setAttribute("stroke", p.accent);
      el.setAttribute("stroke-width", String(L.width));
      el.setAttribute("stroke-dasharray", "100");
      el.setAttribute("stroke-dashoffset", String((100 * (1 - pr)).toFixed(3)));
      el.setAttribute("opacity", String(L.alpha));
    }

    caption.textContent = p.caption;
    caption.style.left = "0px";
    caption.style.width = w + "px";
    caption.style.top = Math.round(cy + ry + size * 0.46) + "px";
    caption.style.fontSize = Math.round(h * 0.0165) + "px";
    caption.style.opacity = String(cap * 0.9);
    caption.style.transform = "translate3d(0," + Math.round((1 - cap) * h * 0.012) + "px,0)";
  }

  window.__vxSeek = function (t) {
    apply(t);
    void stage.offsetHeight;
    return new Promise(function (resolve) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { void stage.offsetHeight; whenFontsReady().then(resolve); });
      });
    });
  };

  apply(0);
})();
</script>
</body>
</html>
