<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vx-transition-luma</title>
<style>
  /* Bundled OFL fonts (assets/fonts), shared by every Motion Studio template. */
  @font-face {
    font-family: "VX Antonio";
    src: url("../../fonts/Antonio-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Antonio";
    src: url("../../fonts/Antonio-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Inter";
    src: url("../../fonts/Inter-Variable.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  :root {
    --vx-font-display: "VX Antonio", "VX Inter", sans-serif;
    --vx-font-text: "VX Inter", "VX Antonio", sans-serif;
    --vx-font-family: var(--vx-font-display);
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    -webkit-font-smoothing: antialiased;
    font-family: var(--vx-font-family);
  }
  #stage { position: absolute; inset: 0; background: transparent; overflow: hidden; }
  #field { position: absolute; inset: 0; }
  #front { position: absolute; left: 0; top: 0; height: 100%; }
</style>
</head>
<body>
<div id="stage">
  <div id="field"></div>
  <div id="front"></div>
</div>
<script>
/* Clock contract: the harness writes window.__vxParams, then calls
   window.__vxSeek(t) for each frame. Everything below is a pure function of t
   and the params; nothing reads a clock. */
(function () {
  "use strict";

  var TOTAL = 2.0;

  var DEFAULTS = {
    font: "inter",
    fill: "#141026",
    tint: "#38E1FF",
    feather: 0.16
  };

  var el = {
    stage: document.getElementById("stage"),
    field: document.getElementById("field"),
    front: document.getElementById("front")
  };

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function rgba(hexValue, alpha) {
    var value = String(hexValue).replace("#", "");
    if (value.length === 3) {
      value = value.charAt(0) + value.charAt(0) +
              value.charAt(1) + value.charAt(1) +
              value.charAt(2) + value.charAt(2);
    }
    var r = parseInt(value.slice(0, 2), 16) || 0;
    var g = parseInt(value.slice(2, 4), 16) || 0;
    var b = parseInt(value.slice(4, 6), 16) || 0;
    return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
  }

  function whenFontsReady() {
    if (!document.fonts) { return Promise.resolve(); }
    return Promise.all([
      document.fonts.load('400 40px "VX Antonio"'),
      document.fonts.load('700 40px "VX Antonio"'),
      document.fonts.load('400 40px "VX Inter"')
    ]).catch(function () {}).then(function () {
      return document.fonts.ready;
    });
  }

  function apply(t) {
    var p = Object.assign({}, DEFAULTS, window.__vxParams || {});
    document.documentElement.style.setProperty("--vx-font-family",
      p.font === "inter" ? "var(--vx-font-text)" : "var(--vx-font-display)");
    var w = window.innerWidth;
    var h = window.innerHeight;
    var fill = String(p.fill || DEFAULTS.fill);
    var tint = String(p.tint || DEFAULTS.tint);
    var feather = Number(p.feather);

    if (!(feather >= 0.02)) { feather = 0.02; }
    if (feather > 0.45) { feather = 0.45; }

    var u = clamp01(t / TOTAL);
    var frontX = u * w;
    var band = feather * w;
    var a = Math.max(0, frontX - band);
    var b = Math.min(w, frontX + band);

    el.field.style.background = "linear-gradient(90deg, " + fill + " 0px, " +
      fill + " " + Math.round(a) + "px, " + rgba(fill, 0) + " " +
      Math.round(b) + "px, " + rgba(fill, 0) + " " + w + "px)";

    var frontW = Math.round(w * 0.11);
    el.front.style.width = frontW + "px";
    el.front.style.transform = "translate3d(" + Math.round(frontX - frontW / 2) + "px,0,0)";
    el.front.style.background = "linear-gradient(90deg, " + rgba(tint, 0) +
      " 0%, " + rgba(tint, 0.30) + " 42%, " + rgba(tint, 0.62) + " 78%, " +
      rgba(tint, 0) + " 100%)";
  }

  window.__vxSeek = function (t) {
    apply(t);
    void el.stage.offsetHeight;
    return new Promise(function (resolve) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          void el.stage.offsetHeight;
          whenFontsReady().then(resolve);
        });
      });
    });
  };

  apply(0);
})();
</script>
</body>
</html>
