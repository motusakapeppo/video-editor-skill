<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vx-card-cta</title>
<style>
  /* Bundled OFL fonts (assets/fonts), shared by every Motion Studio template.
     Six selectable families; each bundled file gets one face declaration. */
  @font-face {
    font-family: "VX Antonio";
    src: url("../../fonts/Antonio-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Antonio";
    src: url("../../fonts/Antonio-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Inter";
    src: url("../../fonts/Inter-Variable.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Bebas Neue";
    src: url("../../fonts/BebasNeue.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Montserrat";
    src: url("../../fonts/Montserrat.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Playfair Display";
    src: url("../../fonts/PlayfairDisplay.ttf") format("truetype");
    font-weight: 400 900;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX JetBrains Mono";
    src: url("../../fonts/JetBrainsMono.ttf") format("truetype");
    font-weight: 100 800;
    font-style: normal;
    font-display: block;
  }
  :root {
    --vx-font-antonio: "VX Antonio", "VX Inter", sans-serif;
    --vx-font-inter: "VX Inter", "VX Antonio", sans-serif;
    --vx-font-bebasneue: "VX Bebas Neue", "VX Antonio", sans-serif;
    --vx-font-montserrat: "VX Montserrat", "VX Inter", sans-serif;
    --vx-font-playfairdisplay: "VX Playfair Display", "VX Inter", serif;
    --vx-font-jetbrainsmono: "VX JetBrains Mono", "VX Inter", monospace;
    --vx-font-family: var(--vx-font-antonio);
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    -webkit-font-smoothing: antialiased;
    font-family: var(--vx-font-family);
  }
  #stage {
    position: absolute;
    inset: 0;
    background: transparent;
    overflow: hidden;
  }
  #headline {
    position: absolute;
    color: #FFFFFF;
    font-weight: 800;
    letter-spacing: -0.032em;
    line-height: 1.04;
    text-shadow: 0 4px 30px rgba(0, 0, 0, 0.52);
    transform-origin: 0% 100%;
  }
  #mark {
    position: absolute;
    transform-origin: 0% 50%;
  }
  #bar {
    position: absolute;
    background: rgba(11, 12, 17, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.45);
    transform-origin: 0% 50%;
    display: flex;
    align-items: center;
  }
  #barText {
    color: rgba(255, 255, 255, 0.86);
    font-weight: 700;
    letter-spacing: 0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #pill {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    transform-origin: 50% 50%;
  }
  #pill span {
    font-weight: 800;
    letter-spacing: 0.02em;
    white-space: nowrap;
    color: #0B0C11;
  }
  #arrow {
    display: block;
    transform-origin: 50% 50%;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="headline"></div>
  <div id="mark"></div>
  <div id="bar">
    <div id="barText"></div>
  </div>
  <div id="pill">
    <span id="pillLabel"></span>
    <svg id="arrow" viewBox="0 0 24 24" fill="none" stroke="#0B0C11" stroke-width="2.4"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12 H19"></path>
      <path d="M12.5 5.5 L19 12 L12.5 18.5"></path>
    </svg>
  </div>
</div>
<script>
/* vx-card-cta: a headline, a hairline accent mark and a capsule call-to-action
   bar whose pill button and arrow snap in from the right. */
(function () {
  "use strict";

  var VX_FONT_IDS = [
    "antonio", "inter", "bebasneue",
    "montserrat", "playfairdisplay", "jetbrainsmono"
  ];

  var DUR = 2.0;
  var DEFAULTS = {
    font: "inter",
    headline: "Non perdere la prossima data",
    action: "Iscriviti",
    note: "posti limitati",
    accent: "#FFD400"
  };

  var stage = document.getElementById("stage");
  var headline = document.getElementById("headline");
  var mark = document.getElementById("mark");
  var bar = document.getElementById("bar");
  var barText = document.getElementById("barText");
  var pill = document.getElementById("pill");
  var pillLabel = document.getElementById("pillLabel");
  var arrow = document.getElementById("arrow");

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function span(t, a, b) { return clamp01((t - a) / (b - a)); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeOutQuint(x) { return 1 - Math.pow(1 - x, 5); }
  function easeOutBack(x) {
    var c1 = 2.1, c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  function whenFontsReady() {
    if (!document.fonts) { return Promise.resolve(); }
    return Promise.all([
      document.fonts.load('400 40px "VX Antonio"'),
      document.fonts.load('700 40px "VX Antonio"'),
      document.fonts.load('400 40px "VX Inter"'),
      document.fonts.load('400 40px "VX Bebas Neue"'),
      document.fonts.load('400 40px "VX Montserrat"'),
      document.fonts.load('400 40px "VX Playfair Display"'),
      document.fonts.load('400 40px "VX JetBrains Mono"')
    ]).catch(function () {}).then(function () {
      return document.fonts.ready;
    });
  }

  function apply(t) {
    var p = Object.assign({}, DEFAULTS, window.__vxParams || {});
    var vxFontId = VX_FONT_IDS.indexOf(p.font) >= 0 ? p.font : DEFAULTS.font;
    document.documentElement.style.setProperty("--vx-font-family",
      "var(--vx-font-" + vxFontId + ")");
    var w = window.innerWidth;
    var h = window.innerHeight;
    var left = Math.round(w * 0.068);
    var width = Math.round(w * 0.864);
    var headP = easeOutQuint(span(t, 0.02 * DUR, 0.26 * DUR));
    var markP = easeOutQuint(span(t, 0.16 * DUR, 0.34 * DUR));
    var barP = easeOutQuint(span(t, 0.24 * DUR, 0.44 * DUR));
    var pillP = easeOutBack(span(t, 0.36 * DUR, 0.54 * DUR));
    var arrowP = easeOutCubic(span(t, 0.46 * DUR, 0.62 * DUR));
    var exit = easeOutCubic(span(t, 0.90 * DUR, 1.0 * DUR));

    var len = String(p.headline).length;
    var headPx = Math.round(h * 0.050);
    if (len > 34) { headPx = Math.round(h * 0.043); }
    if (len > 52) { headPx = Math.round(h * 0.036); }

    headline.textContent = p.headline;
    headline.style.left = left + "px";
    headline.style.width = Math.round(width * 0.94) + "px";
    headline.style.top = Math.round(h * 0.372) + "px";
    headline.style.fontSize = headPx + "px";
    headline.style.opacity = String(clamp01(headP * 1.5) * (1 - exit));
    headline.style.transform = "translate3d(0," +
      Math.round((1 - headP) * h * 0.04 + exit * h * 0.03) + "px,0)";

    mark.style.left = left + "px";
    mark.style.top = Math.round(h * 0.600) + "px";
    mark.style.width = Math.round(w * 0.10) + "px";
    mark.style.height = Math.max(4, Math.round(h * 0.0035)) + "px";
    mark.style.background = p.accent;
    mark.style.opacity = String(markP);
    mark.style.transform = "scaleX(" + markP.toFixed(4) + ")";

    var barH = Math.round(h * 0.108);
    var barTop = Math.round(h * 0.672);
    var pillH = Math.round(barH * 0.66);
    var pillW = Math.round(Math.min(w * 0.40, barH * 3.4));

    bar.style.left = left + "px";
    bar.style.width = width + "px";
    bar.style.top = barTop + "px";
    bar.style.height = barH + "px";
    bar.style.borderRadius = Math.round(barH / 2) + "px";
    bar.style.opacity = String(clamp01(barP * 1.4) * (1 - exit));
    bar.style.transform = "scaleX(" + (0.94 + 0.06 * barP).toFixed(4) +
      ") translate3d(0," + Math.round((1 - barP) * h * 0.03 + exit * h * 0.02) + "px,0)";

    barText.textContent = p.note;
    barText.style.fontSize = Math.round(h * 0.0195) + "px";
    barText.style.marginLeft = Math.round(barH * 0.52) + "px";
    barText.style.maxWidth = Math.round(width - pillW - barH * 1.1) + "px";
    barText.style.opacity = String(clamp01((barP - 0.3) * 2));

    pill.style.width = pillW + "px";
    pill.style.height = pillH + "px";
    pill.style.left = Math.round(left + width - pillW - (barH - pillH) / 2) + "px";
    pill.style.top = Math.round(barTop + (barH - pillH) / 2) + "px";
    pill.style.background = p.accent;
    pill.style.boxShadow = "0 12px 30px rgba(0, 0, 0, 0.34)";
    pill.style.opacity = String(clamp01(pillP * 1.6) * (1 - exit));
    pill.style.transform = "translate3d(" + Math.round((1 - pillP) * w * 0.10) + "px,0,0)";

    pillLabel.textContent = p.action;
    pillLabel.style.fontSize = Math.round(h * 0.0198) + "px";

    var arrowSize = Math.round(pillH * 0.46);
    arrow.style.width = arrowSize + "px";
    arrow.style.height = arrowSize + "px";
    arrow.style.marginLeft = Math.round(pillH * 0.20) + "px";
    arrow.style.opacity = String(clamp01(arrowP * 1.8));
    arrow.style.transform = "translate3d(" + Math.round((1 - arrowP) * pillH * 0.35) +
      "px,0,0)";
  }

  window.__vxSeek = function (t) {
    apply(t);
    void stage.offsetHeight;
    return new Promise(function (resolve) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { void stage.offsetHeight; whenFontsReady().then(resolve); });
      });
    });
  };

  apply(0);
})();
</script>
</body>
</html>
