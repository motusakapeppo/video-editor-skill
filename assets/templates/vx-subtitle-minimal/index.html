<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vx-subtitle-minimal</title>
<style>
  /* Bundled OFL fonts (assets/fonts), shared by every Motion Studio template. */
  @font-face {
    font-family: "VX Antonio";
    src: url("../../fonts/Antonio-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Antonio";
    src: url("../../fonts/Antonio-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Inter";
    src: url("../../fonts/Inter-Variable.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  :root {
    --vx-font-display: "VX Antonio", "VX Inter", sans-serif;
    --vx-font-text: "VX Inter", "VX Antonio", sans-serif;
    --vx-font-family: var(--vx-font-display);
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    -webkit-font-smoothing: antialiased;
    font-family: var(--vx-font-family);
  }
  #stage { position: absolute; inset: 0; background: transparent; }
  #wrap {
    position: absolute;
    text-align: center;
    font-weight: 300;
    line-height: 1.42;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.46);
    will-change: transform, opacity;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap"></div>
</div>
<script>
/* Nothing decorative: one block of type, a fade and a short rise, both read
   from t. No clock, no CSS animation. */
(function () {
  "use strict";

  var DURATION = 2.2;

  var DEFAULTS = {
    font: "inter",
    text: "Poche parole, scelte bene",
    colour: "#F2EFE6",
    rise: 26,
    tracking: "normal"
  };

  var el = {
    stage: document.getElementById("stage"),
    wrap: document.getElementById("wrap")
  };

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function span(t, a, b) { return clamp01((t - a) / (b - a)); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }

  function whenFontsReady() {
    if (!document.fonts) { return Promise.resolve(); }
    return Promise.all([
      document.fonts.load('400 40px "VX Antonio"'),
      document.fonts.load('700 40px "VX Antonio"'),
      document.fonts.load('400 40px "VX Inter"')
    ]).catch(function () {}).then(function () {
      return document.fonts.ready;
    });
  }

  function apply(t) {
    var p = Object.assign({}, DEFAULTS, window.__vxParams || {});
    document.documentElement.style.setProperty("--vx-font-family",
      p.font === "inter" ? "var(--vx-font-text)" : "var(--vx-font-display)");
    var w = window.innerWidth;
    var h = window.innerHeight;
    var rise = Number(p.rise);
    var fontPx;
    var trackEnd;
    var local;
    var exit;

    if (!isFinite(rise)) { rise = 0; }
    if (rise < 0) { rise = 0; }

    fontPx = Math.round(h * 0.034);
    trackEnd = p.tracking === "wide" ? 0.075 : 0.012;

    el.wrap.style.left = Math.round(w * 0.09) + "px";
    el.wrap.style.right = Math.round(w * 0.09) + "px";
    el.wrap.style.bottom = Math.round(h * 0.112) + "px";
    el.wrap.style.fontSize = fontPx + "px";
    el.wrap.style.color = p.colour;
    el.wrap.textContent = String(p.text);

    local = easeOutCubic(span(t, 0.16, 0.94));
    exit = 1 - span(t, DURATION * 0.84, DURATION * 0.99);

    el.wrap.style.opacity = String(clamp01(local * 1.05) * exit * 0.97);
    el.wrap.style.letterSpacing =
      (trackEnd * (1 - local) + 0.010 * local).toFixed(4) + "em";
    el.wrap.style.transform = "translate3d(0," +
      Math.round((1 - local) * rise) + "px,0)";
  }

  window.__vxSeek = function (t) {
    apply(t);
    void el.stage.offsetHeight;
    return new Promise(function (resolve) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          void el.stage.offsetHeight;
          whenFontsReady().then(resolve);
        });
      });
    });
  };

  apply(0);
})();
</script>
</body>
</html>
