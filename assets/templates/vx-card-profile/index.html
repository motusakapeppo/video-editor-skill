<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vx-card-profile</title>
<style>
  /* Bundled OFL fonts (assets/fonts), shared by every Motion Studio template. */
  @font-face {
    font-family: "VX Antonio";
    src: url("../../fonts/Antonio-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Antonio";
    src: url("../../fonts/Antonio-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Inter";
    src: url("../../fonts/Inter-Variable.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  :root {
    --vx-font-display: "VX Antonio", "VX Inter", sans-serif;
    --vx-font-text: "VX Inter", "VX Antonio", sans-serif;
    --vx-font-family: var(--vx-font-display);
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    -webkit-font-smoothing: antialiased;
    font-family: var(--vx-font-family);
  }
  #stage {
    position: absolute;
    inset: 0;
    background: transparent;
    overflow: hidden;
  }
  #card {
    position: absolute;
    background: rgba(10, 11, 17, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 34px 90px rgba(0, 0, 0, 0.48);
    transform-origin: 50% 100%;
  }
  #avatar {
    position: absolute;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: #0C0D12;
    transform-origin: 50% 50%;
  }
  #ring {
    position: absolute;
    border-radius: 50%;
    transform-origin: 50% 50%;
  }
  #name {
    position: absolute;
    color: #FFFFFF;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.0;
    text-align: center;
  }
  #role {
    position: absolute;
    font-weight: 700;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    text-align: center;
  }
  #tag {
    position: absolute;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    color: rgba(255, 255, 255, 0.80);
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-align: center;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="card"></div>
  <div id="ring"></div>
  <div id="avatar"></div>
  <div id="name"></div>
  <div id="role"></div>
  <div id="tag"></div>
</div>
<script>
/* vx-card-profile: an initials avatar breaking the card's top edge, a name,
   a spaced role line and a small tag pill underneath. */
(function () {
  "use strict";

  var DUR = 2.3;
  var DEFAULTS = {
    font: "inter",
    name: "Giulia Ferri",
    role: "Fotografa",
    tag: "Ospite",
    accent: "#FF5C8A"
  };

  var stage = document.getElementById("stage");
  var card = document.getElementById("card");
  var ring = document.getElementById("ring");
  var avatar = document.getElementById("avatar");
  var name = document.getElementById("name");
  var role = document.getElementById("role");
  var tag = document.getElementById("tag");

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function span(t, a, b) { return clamp01((t - a) / (b - a)); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeOutQuint(x) { return 1 - Math.pow(1 - x, 5); }
  function easeOutBack(x) {
    var c1 = 2.6, c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  function initialsOf(value) {
    var parts = String(value).split(/\s+/);
    var out = "";
    for (var i = 0; i < parts.length && out.length < 2; i++) {
      var piece = parts[i];
      if (piece.length > 0) { out += piece.charAt(0).toUpperCase(); }
    }
    return out || "\u00B7";
  }

  function whenFontsReady() {
    if (!document.fonts) { return Promise.resolve(); }
    return Promise.all([
      document.fonts.load('400 40px "VX Antonio"'),
      document.fonts.load('700 40px "VX Antonio"'),
      document.fonts.load('400 40px "VX Inter"')
    ]).catch(function () {}).then(function () {
      return document.fonts.ready;
    });
  }

  function apply(t) {
    var p = Object.assign({}, DEFAULTS, window.__vxParams || {});
    document.documentElement.style.setProperty("--vx-font-family",
      p.font === "inter" ? "var(--vx-font-text)" : "var(--vx-font-display)");
    var w = window.innerWidth;
    var h = window.innerHeight;
    var width = Math.round(w * 0.82);
    var left = Math.round((w - width) / 2);
    var top = Math.round(h * 0.315);
    var height = Math.round(h * 0.300);
    var av = Math.round(w * 0.185);
    var cv = Math.round((w - av) / 2);
    var cTop = top;

    var rise = easeOutQuint(span(t, 0.03 * DUR, 0.28 * DUR));
    var pop = easeOutBack(span(t, 0.12 * DUR, 0.38 * DUR));
    var ringP = easeOutQuint(span(t, 0.20 * DUR, 0.44 * DUR));
    var nameP = easeOutCubic(span(t, 0.26 * DUR, 0.44 * DUR));
    var roleP = easeOutCubic(span(t, 0.34 * DUR, 0.50 * DUR));
    var tagP = easeOutBack(span(t, 0.40 * DUR, 0.54 * DUR));
    var exit = easeOutCubic(span(t, 0.90 * DUR, 1.0 * DUR));

    card.style.left = left + "px";
    card.style.width = width + "px";
    card.style.top = top + "px";
    card.style.height = height + "px";
    card.style.borderRadius = Math.round(w * 0.048) + "px";
    card.style.opacity = String(clamp01(rise * 1.45) * (1 - exit));
    card.style.transform = "translate3d(0," +
      Math.round((1 - rise) * h * 0.045 + exit * h * 0.028) + "px,0) scale(" +
      (0.965 + 0.035 * rise).toFixed(4) + ")";

    avatar.style.width = av + "px";
    avatar.style.height = av + "px";
    avatar.style.left = cv + "px";
    avatar.style.top = Math.round(cTop - av * 0.5) + "px";
    avatar.style.fontSize = Math.round(av * 0.38) + "px";
    avatar.style.background =
      "linear-gradient(150deg, " + p.accent + " 0%, #FFFFFF 118%)";
    avatar.style.boxShadow = "0 18px 50px rgba(0,0,0,0.42)";
    avatar.textContent = initialsOf(p.name);
    avatar.style.opacity = String(clamp01(pop * 1.5) * (1 - exit));
    avatar.style.transform = "scale(" + (0.55 + 0.45 * pop).toFixed(4) + ")";

    var ringSize = Math.round(av * 1.20);
    ring.style.width = ringSize + "px";
    ring.style.height = ringSize + "px";
    ring.style.left = Math.round((w - ringSize) / 2) + "px";
    ring.style.top = Math.round(cTop - ringSize * 0.5) + "px";
    ring.style.border = Math.max(3, Math.round(w * 0.0045)) + "px solid " + p.accent;
    ring.style.opacity = String(ringP * 0.85 * (1 - exit));
    ring.style.transform = "scale(" + (0.82 + 0.18 * ringP).toFixed(4) + ")";

    name.textContent = p.name;
    name.style.left = Math.round(left + width * 0.06) + "px";
    name.style.width = Math.round(width * 0.88) + "px";
    name.style.top = Math.round(top + h * 0.112) + "px";
    name.style.fontSize = Math.round(h * 0.050) + "px";
    name.style.opacity = String(nameP);
    name.style.transform = "translate3d(0," + Math.round((1 - nameP) * h * 0.016) + "px,0)";

    role.textContent = p.role;
    role.style.left = Math.round(left + width * 0.06) + "px";
    role.style.width = Math.round(width * 0.88) + "px";
    role.style.top = Math.round(top + h * 0.182) + "px";
    role.style.fontSize = Math.round(h * 0.0175) + "px";
    role.style.color = p.accent;
    role.style.opacity = String(roleP);

    tag.textContent = p.tag;
    tag.style.fontSize = Math.round(h * 0.0145) + "px";
    tag.style.padding = Math.round(h * 0.0105) + "px " + Math.round(w * 0.036) + "px";
    tag.style.left = "50%";
    tag.style.top = Math.round(top + h * 0.236) + "px";
    tag.style.transform = "translateX(-50%) scale(" + (0.80 + 0.20 * tagP).toFixed(4) + ")";
    tag.style.opacity = String(clamp01(tagP * 1.4) * (1 - exit));
  }

  window.__vxSeek = function (t) {
    apply(t);
    void stage.offsetHeight;
    return new Promise(function (resolve) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { void stage.offsetHeight; whenFontsReady().then(resolve); });
      });
    });
  };

  apply(0);
})();
</script>
</body>
</html>
