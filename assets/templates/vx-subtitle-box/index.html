<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vx-subtitle-box</title>
<style>
  /* Bundled OFL fonts (assets/fonts), shared by every Motion Studio template.
     Six selectable families; each bundled file gets one face declaration. */
  @font-face {
    font-family: "VX Antonio";
    src: url("../../fonts/Antonio-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Antonio";
    src: url("../../fonts/Antonio-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Inter";
    src: url("../../fonts/Inter-Variable.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Bebas Neue";
    src: url("../../fonts/BebasNeue.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Montserrat";
    src: url("../../fonts/Montserrat.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Playfair Display";
    src: url("../../fonts/PlayfairDisplay.ttf") format("truetype");
    font-weight: 400 900;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX JetBrains Mono";
    src: url("../../fonts/JetBrainsMono.ttf") format("truetype");
    font-weight: 100 800;
    font-style: normal;
    font-display: block;
  }
  :root {
    --vx-font-antonio: "VX Antonio", "VX Inter", sans-serif;
    --vx-font-inter: "VX Inter", "VX Antonio", sans-serif;
    --vx-font-bebasneue: "VX Bebas Neue", "VX Antonio", sans-serif;
    --vx-font-montserrat: "VX Montserrat", "VX Inter", sans-serif;
    --vx-font-playfairdisplay: "VX Playfair Display", "VX Inter", serif;
    --vx-font-jetbrainsmono: "VX JetBrains Mono", "VX Inter", monospace;
    --vx-font-family: var(--vx-font-antonio);
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    -webkit-font-smoothing: antialiased;
    font-family: var(--vx-font-family);
  }
  #stage { position: absolute; inset: 0; background: transparent; }
  #boxwrap {
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    text-align: center;
  }
  #group { position: relative; display: inline-block; max-width: 100%; }
  #box {
    position: absolute;
    inset: 0;
    transform-origin: 50% 50%;
    will-change: transform, opacity;
  }
  #text {
    position: relative;
    color: #101012;
    font-weight: 800;
    line-height: 1.14;
    letter-spacing: -0.008em;
    will-change: transform, opacity;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="boxwrap">
    <div id="group">
      <div id="box"></div>
      <div id="text"></div>
    </div>
  </div>
</div>
<script>
/* Pure function of t and the params. No clock, no CSS animation: the harness
   pauses those, so the box is grown by writing transform from t. */
(function () {
  "use strict";

  var VX_FONT_IDS = [
    "antonio", "inter", "bebasneue",
    "montserrat", "playfairdisplay", "jetbrainsmono"
  ];

  var DURATION = 2.2;

  var DEFAULTS = {
    font: "inter",
    text: "Qui comincia il viaggio",
    accent: "#FFD400",
    radius: 26,
    casing: "none"
  };

  var el = {
    stage: document.getElementById("stage"),
    boxwrap: document.getElementById("boxwrap"),
    group: document.getElementById("group"),
    box: document.getElementById("box"),
    text: document.getElementById("text")
  };

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function span(t, a, b) { return clamp01((t - a) / (b - a)); }
  function easeOutQuint(x) { return 1 - Math.pow(1 - x, 5); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }

  function whenFontsReady() {
    if (!document.fonts) { return Promise.resolve(); }
    return Promise.all([
      document.fonts.load('400 40px "VX Antonio"'),
      document.fonts.load('700 40px "VX Antonio"'),
      document.fonts.load('400 40px "VX Inter"'),
      document.fonts.load('400 40px "VX Bebas Neue"'),
      document.fonts.load('400 40px "VX Montserrat"'),
      document.fonts.load('400 40px "VX Playfair Display"'),
      document.fonts.load('400 40px "VX JetBrains Mono"')
    ]).catch(function () {}).then(function () {
      return document.fonts.ready;
    });
  }

  function apply(t) {
    var p = Object.assign({}, DEFAULTS, window.__vxParams || {});
    var vxFontId = VX_FONT_IDS.indexOf(p.font) >= 0 ? p.font : DEFAULTS.font;
    document.documentElement.style.setProperty("--vx-font-family",
      "var(--vx-font-" + vxFontId + ")");
    var w = window.innerWidth;
    var h = window.innerHeight;
    var text = String(p.text);
    var radius = Number(p.radius);
    var fontPx;
    var padY;
    var padX;
    var grow;
    var textIn;
    var exit;
    var rise;
    var lift;

    if (!isFinite(radius)) { radius = 0; }
    if (radius < 0) { radius = 0; }
    if (p.casing === "upper") { text = text.toUpperCase(); }

    fontPx = Math.round(h * 0.038);
    padY = Math.round(h * 0.0145);
    padX = Math.round(w * 0.030);

    el.boxwrap.style.left = Math.round(w * 0.07) + "px";
    el.boxwrap.style.right = Math.round(w * 0.07) + "px";
    el.boxwrap.style.bottom = Math.round(h * 0.105) + "px";

    el.text.style.fontSize = fontPx + "px";
    el.text.style.padding = padY + "px " + padX + "px";
    el.text.textContent = text;

    el.box.style.background = p.accent;
    el.box.style.borderRadius = radius + "px";

    grow = easeOutQuint(span(t, 0.10, 0.72));
    textIn = easeOutCubic(span(t, 0.28, 0.80));
    exit = span(t, DURATION * 0.80, DURATION * 0.98);
    rise = Math.round(h * 0.024);
    lift = Math.round((1 - easeOutCubic(span(t, 0.10, 0.90))) * rise);

    el.box.style.opacity = String(clamp01(grow * 1.8) * (1 - exit));
    el.box.style.transform = "scaleX(" + (0.10 + 0.90 * grow).toFixed(5) + ")";

    el.text.style.opacity = String(clamp01(textIn * 1.1) * (1 - exit));
    el.text.style.transform = "translate3d(0," + (-lift) + "px,0)";
  }

  window.__vxSeek = function (t) {
    apply(t);
    void el.stage.offsetHeight;
    return new Promise(function (resolve) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          void el.stage.offsetHeight;
          whenFontsReady().then(resolve);
        });
      });
    });
  };

  apply(0);
})();
</script>
</body>
</html>
