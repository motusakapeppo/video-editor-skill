<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vx-subtitle-pop</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    -webkit-font-smoothing: antialiased;
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  #stage { position: absolute; inset: 0; background: transparent; }
  #wrap {
    position: absolute;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: center;
    text-align: center;
    line-height: 1.12;
    font-weight: 800;
    letter-spacing: -0.015em;
    text-shadow: 0 4px 26px rgba(0, 0, 0, 0.55), 0 1px 4px rgba(0, 0, 0, 0.45);
  }
  #wrap .word {
    display: inline-block;
    white-space: pre;
    transform-origin: 50% 86%;
    will-change: transform, opacity;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap"></div>
</div>
<script>
/* Contract for every Motion Studio template (see vx.motion.capture):
   the harness writes window.__vxParams, then calls window.__vxSeek(t) for each
   frame and waits for the returned promise. Nothing here may read the clock or
   animate on its own: the picture is a pure function of t and the params. */
(function () {
  "use strict";

  var DURATION = 2.4;

  var DEFAULTS = {
    text: "Ogni istante conta davvero",
    accent: "#FFD400",
    casing: "none",
    emphasis: 2
  };

  var el = {
    stage: document.getElementById("stage"),
    wrap: document.getElementById("wrap")
  };

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function span(t, a, b) { return clamp01((t - a) / (b - a)); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeOutBack(x) {
    var c1 = 1.28;
    var c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  function apply(t) {
    var p = Object.assign({}, DEFAULTS, window.__vxParams || {});
    var w = window.innerWidth;
    var h = window.innerHeight;
    var text = String(p.text);
    var words;
    var fontPx;
    var gapPx;
    var count;
    var emphasis;
    var rise;
    var exit;
    var stagger;
    var node;
    var i;
    var word;
    var start;
    var local;
    var scale;
    var shift;
    var alpha;

    if (p.casing === "upper") { text = text.toUpperCase(); }
    words = text.split(/\s+/).filter(function (item) { return item.length > 0; });
    if (!words.length) { words = [""]; }

    fontPx = Math.round(h * 0.040);
    gapPx = Math.round(h * 0.014);

    el.wrap.style.left = Math.round(w * 0.07) + "px";
    el.wrap.style.right = Math.round(w * 0.07) + "px";
    el.wrap.style.bottom = Math.round(h * 0.108) + "px";
    el.wrap.style.fontSize = fontPx + "px";
    el.wrap.style.gap = gapPx + "px";

    el.wrap.textContent = "";
    count = words.length;
    emphasis = Number(p.emphasis);
    rise = Math.round(h * 0.020);
    exit = span(t, DURATION * 0.80, DURATION * 0.97);
    stagger = Math.min(0.075, 0.52 / count);
    node = document.createElement("span");

    for (i = 0; i < count; i++) {
      word = node.cloneNode(false);
      word.className = "word";
      word.textContent = words[i];
      word.style.color = i === emphasis ? p.accent : "#FFFFFF";

      start = 0.10 + i * stagger;
      local = span(t, start, start + 0.34);
      scale = 0.22 + 0.78 * easeOutBack(local);
      shift = Math.round((1 - easeOutCubic(local)) * rise);
      alpha = clamp01(local * 2.4) * (1 - exit);

      word.style.opacity = String(alpha);
      word.style.transform = "translate3d(0," + shift + "px,0) scale(" +
        scale.toFixed(5) + ")";
      el.wrap.appendChild(word);
    }
  }

  window.__vxSeek = function (t) {
    apply(t);
    void el.stage.offsetHeight;
    return new Promise(function (resolve) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          void el.stage.offsetHeight;
          resolve();
        });
      });
    });
  };

  apply(0);
})();
</script>
</body>
</html>
