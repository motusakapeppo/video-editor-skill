<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vx-subtitle-typewriter</title>
<style>
  /* Bundled OFL fonts (assets/fonts), shared by every Motion Studio template.
     Six selectable families; each bundled file gets one face declaration. */
  @font-face {
    font-family: "VX Antonio";
    src: url("../../fonts/Antonio-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Antonio";
    src: url("../../fonts/Antonio-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Inter";
    src: url("../../fonts/Inter-Variable.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Bebas Neue";
    src: url("../../fonts/BebasNeue.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Montserrat";
    src: url("../../fonts/Montserrat.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX Playfair Display";
    src: url("../../fonts/PlayfairDisplay.ttf") format("truetype");
    font-weight: 400 900;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "VX JetBrains Mono";
    src: url("../../fonts/JetBrainsMono.ttf") format("truetype");
    font-weight: 100 800;
    font-style: normal;
    font-display: block;
  }
  :root {
    --vx-font-antonio: "VX Antonio", "VX Inter", sans-serif;
    --vx-font-inter: "VX Inter", "VX Antonio", sans-serif;
    --vx-font-bebasneue: "VX Bebas Neue", "VX Antonio", sans-serif;
    --vx-font-montserrat: "VX Montserrat", "VX Inter", sans-serif;
    --vx-font-playfairdisplay: "VX Playfair Display", "VX Inter", serif;
    --vx-font-jetbrainsmono: "VX JetBrains Mono", "VX Inter", monospace;
    --vx-font-family: var(--vx-font-antonio);
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    -webkit-font-smoothing: antialiased;
    font-family: var(--vx-font-family);
  }
  #stage { position: absolute; inset: 0; background: transparent; }
  #wrap {
    position: absolute;
    text-align: left;
    color: #ffffff;
    font-weight: 600;
    line-height: 1.34;
    letter-spacing: 0.005em;
    text-shadow: 0 3px 18px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.45);
  }
  #typed { white-space: pre-wrap; }
  #caret {
    display: inline-block;
    width: 0.54em;
    height: 1.02em;
    vertical-align: -0.14em;
    margin-left: 0.06em;
    border-radius: 2px;
    will-change: opacity;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap"><span id="typed"></span><span id="caret"></span></div>
</div>
<script>
/* The caret phase and the character count are both derived from t, so the same
   seek always paints the same frame. No wall clock, no CSS animation. */
(function () {
  "use strict";

  var VX_FONT_IDS = [
    "antonio", "inter", "bebasneue",
    "montserrat", "playfairdisplay", "jetbrainsmono"
  ];

  var DURATION = 2.6;

  var DEFAULTS = {
    font: "inter",
    text: "Il tempo non aspetta nessuno",
    accent: "#7CFF6B",
    speed: 1.0,
    casing: "none"
  };

  var el = {
    stage: document.getElementById("stage"),
    wrap: document.getElementById("wrap"),
    typed: document.getElementById("typed"),
    caret: document.getElementById("caret")
  };

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function span(t, a, b) { return clamp01((t - a) / (b - a)); }

  function whenFontsReady() {
    if (!document.fonts) { return Promise.resolve(); }
    return Promise.all([
      document.fonts.load('400 40px "VX Antonio"'),
      document.fonts.load('700 40px "VX Antonio"'),
      document.fonts.load('400 40px "VX Inter"'),
      document.fonts.load('400 40px "VX Bebas Neue"'),
      document.fonts.load('400 40px "VX Montserrat"'),
      document.fonts.load('400 40px "VX Playfair Display"'),
      document.fonts.load('400 40px "VX JetBrains Mono"')
    ]).catch(function () {}).then(function () {
      return document.fonts.ready;
    });
  }

  function apply(t) {
    var p = Object.assign({}, DEFAULTS, window.__vxParams || {});
    var vxFontId = VX_FONT_IDS.indexOf(p.font) >= 0 ? p.font : DEFAULTS.font;
    document.documentElement.style.setProperty("--vx-font-family",
      "var(--vx-font-" + vxFontId + ")");
    var w = window.innerWidth;
    var h = window.innerHeight;
    var text = String(p.text);
    var speed = Number(p.speed);
    var fontPx;
    var finish;
    var q;
    var shown;
    var phase;
    var exit;

    if (!isFinite(speed) || speed <= 0) { speed = 1.0; }
    if (p.casing === "upper") { text = text.toUpperCase(); }

    fontPx = Math.round(h * 0.034);
    finish = 0.16 + 0.72 / speed;

    el.wrap.style.left = Math.round(w * 0.07) + "px";
    el.wrap.style.width = Math.round(w * 0.86) + "px";
    el.wrap.style.right = "auto";
    el.wrap.style.bottom = Math.round(h * 0.108) + "px";
    el.wrap.style.fontSize = fontPx + "px";

    q = span(t, 0.16, finish);
    shown = q >= 1 ? text.length : Math.floor(text.length * q);
    el.typed.textContent = text.slice(0, shown);

    phase = Math.floor(t * 4) % 2 === 0;
    exit = 1 - span(t, DURATION * 0.86, DURATION * 0.99);

    el.caret.style.background = p.accent;
    el.caret.style.opacity = String((phase ? 1 : 0.08) * exit);
    el.wrap.style.opacity = String(clamp01(span(t, 0.04, 0.28)) * exit);
    el.wrap.style.transform = "translate3d(0,0,0)";
  }

  window.__vxSeek = function (t) {
    apply(t);
    void el.stage.offsetHeight;
    return new Promise(function (resolve) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          void el.stage.offsetHeight;
          whenFontsReady().then(resolve);
        });
      });
    });
  };

  apply(0);
})();
</script>
</body>
</html>
