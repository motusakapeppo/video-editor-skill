<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vx-chart-line</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    -webkit-font-smoothing: antialiased;
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  #stage { position: absolute; inset: 0; background: transparent; }
  #caption {
    position: absolute;
    color: rgba(255, 255, 255, 0.58);
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #headline {
    position: absolute;
    text-align: right;
    color: #ffffff;
    font-weight: 800;
    letter-spacing: -0.035em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #chart { position: absolute; }
  #chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
  #labels { position: absolute; }
  #labels div {
    position: absolute;
    text-align: center;
    color: rgba(255, 255, 255, 0.38);
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #badge {
    position: absolute;
    color: #ffffff;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-align: center;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="caption"></div>
  <div id="headline"></div>
  <div id="chart">
    <svg viewBox="0 0 1000 640" aria-hidden="true">
      <g id="grid" stroke="rgba(255,255,255,0.14)" stroke-width="1.4">
        <line x1="0" y1="30" x2="1000" y2="30"></line>
        <line x1="0" y1="160" x2="1000" y2="160"></line>
        <line x1="0" y1="290" x2="1000" y2="290"></line>
        <line x1="0" y1="420" x2="1000" y2="420"></line>
        <line x1="0" y1="550" x2="1000" y2="550"></line>
      </g>
      <path id="line" fill="none" stroke-width="6" stroke-linecap="round"
            stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"></path>
      <g id="dots">
        <circle r="9" stroke-width="3.5" fill="none"></circle>
        <circle r="9" stroke-width="3.5" fill="none"></circle>
        <circle r="9" stroke-width="3.5" fill="none"></circle>
        <circle r="9" stroke-width="3.5" fill="none"></circle>
        <circle r="9" stroke-width="3.5" fill="none"></circle>
        <circle r="10" stroke-width="0" fill="#ffffff"></circle>
      </g>
    </svg>
  </div>
  <div id="labels"></div>
  <div id="badge"></div>
</div>
<script>
/* Contract for every Motion Studio template (see vx.motion.capture):
   the harness writes window.__vxParams, then calls window.__vxSeek(t) for each
   frame and waits for the returned promise. Nothing here may read the clock or
   animate on its own: the picture is a pure function of t and the params. */
(function () {
  "use strict";

  var DEFAULTS = {
    value: 84,
    caption: "Reach",
    labels: "Jan,Feb,Mar,Apr,May,Jun",
    accent: "#38E1FF"
  };

  var BASE = [0.34, 0.52, 0.44, 0.70, 0.60];
  var TOP = 550;
  var SPAN = 470;
  var X0 = 50;
  var STEP_X = 180;

  var TIMELINE = {
    head: [0.02, 0.26],
    grid: [0.04, 0.34],
    draw: [0.12, 0.80],
    labels: [0.30, 0.62]
  };

  var el = {
    stage: document.getElementById("stage"),
    caption: document.getElementById("caption"),
    headline: document.getElementById("headline"),
    chart: document.getElementById("chart"),
    grid: document.getElementById("grid"),
    line: document.getElementById("line"),
    dots: document.getElementById("dots"),
    labels: document.getElementById("labels"),
    badge: document.getElementById("badge")
  };

  var labelEls = [];

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function span(t, pair) { return clamp01((t - pair[0]) / (pair[1] - pair[0])); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeOutQuint(x) { return 1 - Math.pow(1 - x, 5); }
  function finite(v, fallback) {
    var n = Number(v);
    return isFinite(n) ? n : fallback;
  }
  function trimText(raw) {
    var text = String(raw == null ? "" : raw);
    while (text.length && text.charAt(0) === " ") { text = text.slice(1); }
    while (text.length && text.charAt(text.length - 1) === " ") {
      text = text.slice(0, text.length - 1);
    }
    return text;
  }

  function build() {
    var i;
    for (i = 0; i <= BASE.length; i += 1) {
      var cell = document.createElement("div");
      el.labels.appendChild(cell);
      labelEls.push(cell);
    }
  }

  function layout() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    var pad = Math.round(w * 0.085);
    var plotW = w - pad * 2;
    var chartH = Math.round(plotW * 0.64);
    var top = Math.round(h * 0.360);

    el.caption.style.left = pad + "px";
    el.caption.style.top = Math.round(h * 0.302) + "px";
    el.caption.style.fontSize = Math.round(h * 0.0185) + "px";

    el.headline.style.left = pad + "px";
    el.headline.style.width = plotW + "px";
    el.headline.style.top = Math.round(h * 0.268) + "px";
    el.headline.style.fontSize = Math.round(h * 0.062) + "px";

    el.chart.style.left = pad + "px";
    el.chart.style.top = top + "px";
    el.chart.style.width = plotW + "px";
    el.chart.style.height = chartH + "px";

    el.labels.style.left = pad + "px";
    el.labels.style.top = (top + chartH + Math.round(h * 0.022)) + "px";
    el.labels.style.width = plotW + "px";
    el.labels.style.height = Math.round(h * 0.030) + "px";

    var i;
    for (i = 0; i < labelEls.length; i += 1) {
      var cx = ((X0 + STEP_X * i) / 1000) * plotW;
      labelEls[i].style.left = Math.round(cx - plotW * 0.09) + "px";
      labelEls[i].style.width = Math.round(plotW * 0.18) + "px";
      labelEls[i].style.fontSize = Math.round(h * 0.0155) + "px";
    }

    return { plotW: plotW, chartH: chartH, top: top, pad: pad };
  }

  function apply(t) {
    var params = Object.assign({}, DEFAULTS, window.__vxParams || {});
    var box = layout();

    var value = Math.max(0, Math.min(100, finite(params.value, DEFAULTS.value)));
    var head = easeOutCubic(span(t, TIMELINE.head));
    var grid = easeOutCubic(span(t, TIMELINE.grid));
    var draw = easeOutCubic(span(t, TIMELINE.draw));
    var labels = easeOutCubic(span(t, TIMELINE.labels));
    var names = String(params.labels || "").split(",");

    var ratios = BASE.slice(0);
    ratios.push(value / 100);

    var d = "";
    var i;
    var lastX = 0;
    var lastY = 0;
    for (i = 0; i < ratios.length; i += 1) {
      var x = X0 + STEP_X * i;
      var y = TOP - ratios[i] * SPAN;
      d += (i === 0 ? "M" : " L") + x + " " + y.toFixed(2);
      lastX = x;
      lastY = y;
    }

    el.line.setAttribute("d", d.trim());
    el.line.setAttribute("stroke", params.accent);
    el.line.setAttribute("stroke-dashoffset", (1 - draw).toFixed(5));

    el.grid.setAttribute("opacity", (grid * 0.9).toFixed(4));

    var dots = el.dots.children;
    for (i = 0; i < dots.length; i += 1) {
      var x2 = X0 + STEP_X * i;
      var y2 = TOP - ratios[i] * SPAN;
      var appear = clamp01((draw * ratios.length - i) * 1.6);
      dots[i].setAttribute("cx", String(x2));
      dots[i].setAttribute("cy", y2.toFixed(2));
      dots[i].setAttribute("opacity", appear.toFixed(4));
      if (i < dots.length - 1) {
        dots[i].setAttribute("stroke", params.accent);
      }
    }

    el.caption.textContent = params.caption;
    el.caption.style.opacity = String(head);

    el.headline.textContent = String(Math.round(value * head)) + "%";
    el.headline.style.opacity = String(head);

    for (i = 0; i < labelEls.length; i += 1) {
      labelEls[i].textContent = trimText(names[i] || "");
      labelEls[i].style.opacity = String(
        clamp01((labels - i * 0.08) * 2.2) * 0.95
      );
    }

    var bx = box.pad + (lastX / 1000) * box.plotW;
    el.badge.textContent = String(Math.round(value) + "");
    el.badge.style.left = Math.round(bx - box.plotW * 0.06) + "px";
    el.badge.style.width = Math.round(box.plotW * 0.12) + "px";
    el.badge.style.top = (box.top + (lastY / 640) * box.chartH - window.innerHeight * 0.062) + "px";
    el.badge.style.fontSize = Math.round(window.innerHeight * 0.0225) + "px";
    el.badge.style.opacity = String(clamp01((draw - 0.55) * 3));
  }

  window.__vxSeek = function (t) {
    apply(t);
    void el.stage.offsetHeight;
    return new Promise(function (resolve) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { void el.stage.offsetHeight; resolve(); });
      });
    });
  };

  build();
  apply(0);
})();
</script>
</body>
</html>
