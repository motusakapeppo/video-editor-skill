<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vx-subtitle-highlight</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    -webkit-font-smoothing: antialiased;
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  #stage { position: absolute; inset: 0; background: transparent; }
  #wrap {
    position: absolute;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: center;
    text-align: center;
    line-height: 1.26;
    font-weight: 700;
    letter-spacing: -0.008em;
  }
  #wrap .word {
    position: relative;
    display: inline-block;
    white-space: pre;
    padding: 0 0.06em;
  }
  #wrap .mark {
    position: absolute;
    left: -0.02em;
    right: -0.02em;
    bottom: 0.20em;
    height: 0.50em;
    transform-origin: 0 50%;
    will-change: transform, opacity;
  }
  #wrap .txt {
    position: relative;
    color: #ffffff;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.42);
  }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap"></div>
</div>
<script>
/* Pure function of t and the params. The marker is a child span whose scaleX
   is written from t, so the picture never depends on a clock. */
(function () {
  "use strict";

  var DURATION = 2.4;

  var DEFAULTS = {
    text: "Nessuna scorciatoia solo lavoro",
    accent: "#FFD400",
    marker_alpha: 0.62,
    casing: "none"
  };

  var el = {
    stage: document.getElementById("stage"),
    wrap: document.getElementById("wrap")
  };

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function span(t, a, b) { return clamp01((t - a) / (b - a)); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeOutQuint(x) { return 1 - Math.pow(1 - x, 5); }

  function channels(hex) {
    var value = String(hex).replace("#", "");
    var number;
    if (value.length === 3) {
      value = value.charAt(0) + value.charAt(0) + value.charAt(1) +
        value.charAt(1) + value.charAt(2) + value.charAt(2);
    }
    if (value.length === 8) { value = value.slice(0, 6); }
    number = parseInt(value, 16);
    if (!isFinite(number)) { number = 0xFFFFFF; }
    return [(number >> 16) & 255, (number >> 8) & 255, number & 255];
  }

  function apply(t) {
    var p = Object.assign({}, DEFAULTS, window.__vxParams || {});
    var w = window.innerWidth;
    var h = window.innerHeight;
    var text = String(p.text);
    var markerAlpha = Number(p.marker_alpha);
    var rgb;
    var words;
    var fontPx;
    var gapPx;
    var count;
    var exit;
    var stagger;
    var node;
    var i;
    var word;
    var mark;
    var txt;
    var start;
    var local;
    var rise;

    if (!isFinite(markerAlpha)) { markerAlpha = 0; }
    if (markerAlpha < 0) { markerAlpha = 0; }
    if (markerAlpha > 1) { markerAlpha = 1; }
    if (p.casing === "upper") { text = text.toUpperCase(); }
    words = text.split(/\s+/).filter(function (item) { return item.length > 0; });
    if (!words.length) { words = [""]; }
    rgb = channels(p.accent);

    fontPx = Math.round(h * 0.040);
    gapPx = Math.round(h * 0.012);

    el.wrap.style.left = Math.round(w * 0.07) + "px";
    el.wrap.style.right = Math.round(w * 0.07) + "px";
    el.wrap.style.bottom = Math.round(h * 0.106) + "px";
    el.wrap.style.fontSize = fontPx + "px";
    el.wrap.style.gap = gapPx + "px";

    el.wrap.textContent = "";
    count = words.length;
    exit = 1 - span(t, DURATION * 0.82, DURATION * 0.99);
    stagger = Math.min(0.090, 0.62 / count);
    rise = Math.round(h * 0.012);
    node = document.createElement("span");

    for (i = 0; i < count; i++) {
      word = node.cloneNode(false);
      word.className = "word";

      mark = document.createElement("span");
      mark.className = "mark";
      mark.style.background = "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] +
        "," + markerAlpha.toFixed(4) + ")";
      mark.style.borderRadius = Math.round(fontPx * 0.10) + "px";

      txt = document.createElement("span");
      txt.className = "txt";
      txt.textContent = words[i];

      start = 0.14 + i * stagger;
      local = easeOutQuint(span(t, start, start + 0.46));

      mark.style.opacity = String(clamp01(local * 1.7) * exit);
      mark.style.transform = "scaleX(" + local.toFixed(5) + ")";
      txt.style.opacity = String(clamp01(local * 2.2) * exit);
      txt.style.display = "inline-block";
      txt.style.transform = "translate3d(0," +
        Math.round((1 - easeOutCubic(local)) * rise) + "px,0)";

      word.appendChild(mark);
      word.appendChild(txt);
      el.wrap.appendChild(word);
    }
  }

  window.__vxSeek = function (t) {
    apply(t);
    void el.stage.offsetHeight;
    return new Promise(function (resolve) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          void el.stage.offsetHeight;
          resolve();
        });
      });
    });
  };

  apply(0);
})();
</script>
</body>
</html>
