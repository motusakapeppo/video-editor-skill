name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow opencv-python-headless onnxruntime pyyaml

      - name: ffmpeg version
        run: ffmpeg -version | head -n 1

      - name: Suite (every script-style runner)
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          VX_FFMPEG: ffmpeg
        run: python tests/run_all.py --jobs 1 --timeout 1800

      - name: Cross-platform contract
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          VX_FFMPEG: ffmpeg
        run: python tests/test_cross_platform.py

      - name: CPU fallback (no CUDA required)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, os.path.join("scripts"))
          from vx import accel, subs
          target = accel.whisper_target(preferred="cpu")
          assert target["device"] == "cpu", target
          assert target["compute_type"], target
          choice = subs._device_choice("cpu", "int8")
          assert choice["device"] == "cpu", choice
          print(target, choice)
          PY
